<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Tomorrow handover board</title>
<style>
:root{color-scheme:light dark;--bg:#0f1830;--ink:#eef3ff;--muted:#93a0bd;--line:#24324f;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
:root[data-theme=light]{--bg:#fff;--ink:#0b1220;--muted:#5b6782;--line:#dde3ef;--ok:#059669;--warn:#b45309;--bad:#dc2626}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#fff;--ink:#0b1220;--muted:#5b6782;--line:#dde3ef;--ok:#059669;--warn:#b45309;--bad:#dc2626}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
main{padding:14px 16px}header{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
small{color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-size:10px;font-weight:700}h1{font-size:15px;margin:2px 0 8px}
ul{list-style:none;margin:0;padding:0}li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.t{display:flex;flex-direction:column}.t span{color:var(--muted);font-size:12px}
.pill{white-space:nowrap;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid currentColor}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.next{margin:10px 0 4px}.muted{color:var(--muted);font-size:12px;margin:4px 0 0}
footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
button{font:inherit;font-size:12px;font-weight:700;padding:5px 12px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button:disabled{opacity:.5}#stamp{color:var(--muted);font-size:11px}
</style></head><body><main><div id="board" aria-live="polite"></div>
<footer><span id="stamp">MCP App</span><button id="refresh" type="button">Refresh via check_coverage</button></footer></main>
<script>/*APP*/</script></body></html>
